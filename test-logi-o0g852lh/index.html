<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Logimages</title><meta name="robots" content="noindex,nofollow">
<style>
  :root{--bg:#eef3fb;--ink:#22304a;--card:#fff;--edge:#cfdaee;--fill:#2f4b8a;--accent:#f0683c;--soft:#dde6f6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Nunito","Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
  #app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
  h1{font-size:22px;margin:0}
  button{font-family:inherit;border:0;cursor:pointer;color:inherit}
  .pill{background:var(--card);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--edge)}
  .screen{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
  #home{overflow:auto}
  .daily{background:linear-gradient(135deg,#9db8f5,#c7a8f0);border-radius:20px;padding:16px;box-shadow:0 4px 0 #8a93cf;text-align:center}
  .daily b{font-size:19px;display:block}.daily small{font-weight:700;opacity:.8}
  .packs{display:grid;gap:10px}
  .pack{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 3px 0 var(--edge);text-align:left;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .pack small{font-weight:700;opacity:.6}
  .how{background:var(--soft);border-radius:14px;padding:10px 12px;font-weight:600;font-size:13px;line-height:1.4}
  .bar{display:flex;gap:8px;align-items:center;justify-content:space-between}
  #boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #board{display:grid;background:var(--card);border-radius:14px;padding:6px;box-shadow:0 4px 0 var(--edge);touch-action:none}
  .clue{display:flex;align-items:flex-end;justify-content:center;font-weight:800;color:#5a6a8a;line-height:1.05}
  .clue.top{flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:2px}
  .clue.left{justify-content:flex-end;align-items:center;gap:.35em;padding-right:4px}
  .clue.ok{opacity:.3}
  .cell{border:1px solid #c7d2e6;display:flex;align-items:center;justify-content:center;font-weight:900;color:#9aa8c4}
  .cell.f{background:var(--fill);border-color:var(--fill)}
  .cell.bad{animation:bad .4s}
  @keyframes bad{50%{background:#ffb3a6}}
  .cell.t5{border-top:2px solid #6f7fa3}.cell.l5{border-left:2px solid #6f7fa3}
  .modes{display:flex;gap:10px;justify-content:center}
  .modes button{flex:1;max-width:160px;background:var(--card);border-radius:16px;padding:14px;font-weight:900;font-size:17px;box-shadow:0 3px 0 var(--edge)}
  .modes .on{background:var(--ink);color:#fff}
  #win{position:fixed;inset:0;background:rgba(34,48,74,.5);display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--bg);border-radius:22px;padding:22px;text-align:center;max-width:340px;width:100%}
  .card h2{margin:0 0 6px;font-size:25px}.stars{font-size:36px;letter-spacing:4px}
  .cta{background:var(--accent);color:#fff;border-radius:16px;padding:13px 16px;font-weight:900;font-size:16px;width:100%;margin-top:10px;box-shadow:0 4px 0 #a8431f}
  .alt{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--edge)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header><button id="back" class="pill" hidden>←</button><h1 id="ttl"></h1><div style="display:flex;gap:6px"><button id="lang" class="pill"></button><button id="snd" class="pill">🔊</button></div></header>
  <div id="home" class="screen">
    <button id="daily" class="daily"><b id="dT"></b><small id="dS"></small></button>
    <div class="packs" id="packs"></div>
    <div class="how" id="how"></div>
  </div>
  <div id="game" class="screen" hidden>
    <div class="bar"><div class="pill" id="info"></div><div class="pill" id="lives"></div><button class="pill" id="hint"></button></div>
    <div id="boardWrap"><div id="board"></div></div>
    <div class="modes"><button id="mFill">■</button><button id="mCross">✕</button></div>
  </div>
</div>
<div id="win" hidden><div class="card"><div class="stars" id="stars"></div><h2 id="wT"></h2><p id="wS" style="font-weight:700"></p><button class="cta" id="next"></button><button class="cta alt" id="again" hidden></button><button class="cta alt" id="home2"></button></div></div>
