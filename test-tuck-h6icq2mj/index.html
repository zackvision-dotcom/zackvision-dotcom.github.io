<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tuck Still</title><meta name="robots" content="noindex,nofollow">
<style>
  :root{--ink:#422006;--paper:#fffbeb;--edge:#d6b98c;--red:#dc2626;--green:#16a34a}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f2;font-family:ui-rounded,"Nunito","Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .pill{background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--edge)}
  #top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));pointer-events:none}
  #obj{max-width:62vw}
  #right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #menuBtn{pointer-events:auto;border:0;cursor:pointer}
  #toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);max-width:82%;text-align:center;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;font-size:15px;line-height:1.35}
  .btn{border:0;border-radius:999px;font-weight:900;font-family:inherit;color:#fff;touch-action:none;cursor:pointer}
  #freeze{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:96px;height:96px;background:var(--red);font-size:17px;box-shadow:0 6px 0 #7f1d1d}
  #freeze.on{background:#9ca3af;box-shadow:0 2px 0 #4b5563;transform:translateY(4px)}
  #act{position:fixed;right:calc(130px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));min-width:84px;height:64px;padding:0 16px;background:var(--green);font-size:16px;box-shadow:0 5px 0 #14532d;display:none}
  #stick{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6);display:none;pointer-events:none}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85)}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(66,32,6,.35);padding:20px}
  .card{background:var(--paper);color:var(--ink);border-radius:22px;padding:22px 22px 18px;box-shadow:0 6px 0 var(--edge);text-align:center;max-width:380px;width:100%}
  .card h1{font-size:46px;margin:0;letter-spacing:.5px;color:var(--red);text-shadow:0 3px 0 #fde68a}
  .card h2{margin:0 0 8px;font-size:22px}
  .card p{margin:8px 0 14px;font-weight:600;line-height:1.4}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .big{background:var(--red);font-size:22px;padding:14px 38px;box-shadow:0 5px 0 #7f1d1d}
  .small{background:#a16207;font-size:14px;padding:8px 16px;box-shadow:0 3px 0 #713f12}
  #title .gnome{font-size:64px;line-height:1}
  #meter{position:relative;height:34px;border-radius:17px;background:#fde68a;overflow:hidden;margin:10px 0}
  #zone{position:absolute;top:0;bottom:0;background:#4ade80}
  #needle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
  #dots{font-size:22px;letter-spacing:6px}
  #timer{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:none}
  .hats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
  .hat{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 0 var(--edge)}
  .hat b{display:block;font-size:30px}
  #fishUI{align-items:flex-end;background:transparent;padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  [hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><div id="obj" class="pill"></div><div id="right"><div id="coins" class="pill"></div><button id="menuBtn" class="pill">⏸</button></div></div>
<div id="timer" class="pill"></div>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>
<button id="act" class="btn"></button>
<button id="freeze" class="btn"></button>
<div id="title" class="overlay"><div class="card">
  <div class="gnome">🍄</div><h1>Tuck Still</h1><p id="sub"></p>
  <div class="row"><button id="playBtn" class="btn big"></button></div>
  <div class="row" style="margin-top:14px"><button id="langBtn" class="btn small"></button><button id="sndBtn" class="btn small"></button></div>
</div></div>
<div id="fishUI" class="overlay" hidden><div class="card"><h2 id="fishT"></h2><p id="fishH"></p><div id="meter"><div id="zone"></div><div id="needle"></div></div><div id="dots"></div></div></div>
<div id="shopUI" class="overlay" hidden><div class="card"><h2 id="shopT"></h2><div class="hats" id="hats"></div><button id="shopClose" class="btn small">OK</button></div></div>
