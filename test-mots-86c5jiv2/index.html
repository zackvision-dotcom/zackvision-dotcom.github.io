<style>
  :root{--bg:#fff7e8;--ink:#3b2a1a;--card:#ffffff;--edge:#e6d3b3;--accent:#e8663c;--soft:#f6e7cc}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Nunito","Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
  #app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
  h1{font-size:22px;margin:0}
  button{font-family:inherit;border:0;cursor:pointer;color:inherit}
  .pill{background:var(--card);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--edge)}
  .cta{background:var(--accent);color:#fff;border-radius:16px;padding:14px 18px;font-weight:900;font-size:17px;box-shadow:0 4px 0 #a8431f;width:100%}
  .screen{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
  #home{overflow:auto;padding-bottom:10px}
  .daily{background:linear-gradient(135deg,#ffd27a,#ff9d6c);border-radius:20px;padding:16px;box-shadow:0 4px 0 #d9824f}
  .daily b{font-size:19px;display:block}.daily small{font-weight:700;opacity:.8}
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .theme{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 3px 0 var(--edge);text-align:left;font-weight:800;font-size:15px}
  .theme span{font-size:26px;display:block}.theme small{font-weight:700;opacity:.6}
  .sizes{display:flex;gap:8px}.sizes button{flex:1}.sizes .on{background:var(--ink);color:#fff}
  #gridWrap{position:relative;width:100%;aspect-ratio:1;max-height:56vh;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--edge);touch-action:none}
  #grid{position:absolute;inset:8px;display:grid}
  #grid div{display:flex;align-items:center;justify-content:center;font-weight:800;position:relative;z-index:2}
  #lines{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);z-index:1;pointer-events:none}
  #words{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;overflow:auto;padding:2px 0;font-weight:800;font-size:14px}
  #words span{padding:3px 8px;border-radius:9px;background:var(--soft)}
  #words span.done{text-decoration:line-through;opacity:.45}
  #words span.hint{outline:2px solid var(--accent)}
  .bar{display:flex;gap:8px;align-items:center;justify-content:space-between}
  #win{z-index:50;position:fixed;inset:0;background:rgba(59,42,26,.45);display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--bg);border-radius:22px;padding:22px;text-align:center;max-width:360px;width:100%;box-shadow:0 6px 0 var(--edge)}
  .card h2{margin:0 0 6px;font-size:26px}.stars{font-size:38px;letter-spacing:4px}
  [hidden]{display:none!important}
  .langp{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.langp select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
</style>
</head>

  if (sel) h += `<line x1="${c(sel.x0)}%" y1="${c(sel.y0)}%" x2="${c(sel.x1)}%" y2="${c(sel.y1)}%" stroke="#e8663c" stroke-opacity=".45" stroke-width="${u * 0.78}%" stroke-linecap="round"/>`;

  $('lines').innerHTML = h;
}
// ---------- selection by drag (snaps to the 8 directions) ----------
const wrap = $('gridWrap');
function cellAt(e) { const r = $('grid').getBoundingClientRect(), n = G.n; return { x: Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left) / r.width * n))), y: Math.max(0, Math.min(n - 1, Math.floor((e.clientY - r.top) / r.height * n))) }; }

wrap.addEventListener('pointermove', e => { if (!sel) return; const c = cellAt(e); let dx = c.x - sel.x0, dy = c.y - sel.y0; const ax = Math.abs(dx), ay = Math.abs(dy);
  if (ax > ay * 2) dy = 0; else if (ay > ax * 2) dx = 0; else { const m = Math.max(ax, ay); dx = Math.sign(dx) * m; dy = Math.sign(dy) * m; }
  let x1 = sel.x0 + dx, y1 = sel.y0 + dy; const n = G.n; while (x1 < 0 || x1 >= n || y1 < 0 || y1 >= n) { x1 -= Math.sign(dx); y1 -= Math.sign(dy); }
  if (x1 !== sel.x1 || y1 !== sel.y1) { sel.x1 = x1; sel.y1 = y1; lines(); } });
const endSel = () => { if (!sel) return; const s = sel; sel = null;
  const dx = Math.sign(s.x1 - s.x0), dy = Math.sign(s.y1 - s.y0), len = Math.max(Math.abs(s.x1 - s.x0), Math.abs(s.y1 - s.y0)) + 1; let str = ''; for (let k = 0; k < len; k++) str += G.g[s.y0 + dy * k][s.x0 + dx * k];

  lines(); };
wrap.addEventListener('pointerup', endSel); wrap.addEventListener('pointercancel', endSel);
// ---------- hints ----------

  const w = G.words.find(w => !w.found); if (!w) return; S.hints--; G.hints++; hintCell = { x: w.x0, y: w.y0 }; const i = G.words.indexOf(w); $('w' + i).className = 'hint'; save(); hintBtn(); lines(); beep(440, 0.15, 'sine'); };

function win() {

}
$('next').onclick = async () => { if (S.plays % 3 === 0) await ad('interstitial'); start(G.theme, false); };
$('home2').onclick = () => home();
// ---------- home ----------
function home() {

  $('ttl').textContent = t.title; $('lang').textContent = '🌐 ' + lang.toUpperCase(); $('langSel').value = lang; $('snd').textContent = S.muted ? '🔇' : '🔊';
  $('dT').textContent = '📅 ' + t.daily; $('dS').textContent = (S.daily === today() ? t.done + ' · ' : '') + fmt(t.streak, { n: S.daily === today() || S.daily === yesterday() ? S.streak : 0 });

$('sizes').onclick = e => { const b = e.target.closest('[data-s]'); if (b) { S.size = +b.dataset.s; save(); home(); } };
