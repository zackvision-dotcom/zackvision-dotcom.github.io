<style>

  *{box-sizing:border-box}

  header{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:42px}
  h1{font-size:19px;margin:0}
  button{font-family:inherit;border:0;cursor:pointer}
  .pill{background:rgba(0,0,0,.25);color:#fff;border-radius:12px;padding:8px 11px;font-weight:800;font-size:13px}
  .stats{display:flex;gap:6px}
  #board{position:relative;flex:1;margin-top:8px}
  .slot{position:absolute;border-radius:8px;border:2px dashed rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(255,255,255,.4)}

  .card.red{color:var(--red)}
  .card .c{position:absolute;left:8%;top:3%;line-height:1;text-align:center}
  .card .m{position:absolute;right:8%;bottom:6%;line-height:1}
  .card.down{background:repeating-linear-gradient(45deg,#3b6fb6,#3b6fb6 6px,#4a80c8 6px,#4a80c8 12px);border:3px solid var(--paper)}
  .card.hint{outline:3px solid var(--gold);z-index:99}
  .card.shake{animation:sh .25s}
  @keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  footer{display:flex;gap:8px;justify-content:center;padding-top:8px}
  footer button{flex:1;max-width:150px;background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 8px;font-weight:900;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}
  .box{background:var(--paper);color:var(--ink);border-radius:22px;padding:22px;text-align:center;max-width:340px;width:100%}
  .box h2{margin:0 0 6px;font-size:26px}.box p{font-weight:700;margin:6px 0 14px}
  .cta{background:var(--red);color:#fff;border-radius:14px;padding:13px 16px;font-weight:900;font-size:16px;width:100%;margin-top:8px}
  .alt{background:#e8e1cf;color:var(--ink)}
  [hidden]{display:none!important}
  .langp{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.langp select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
</style>
</head>

// ---------- menu ----------
function menu(won, stuck) { const t = T(); $('mT').textContent = won ? t.win : stuck ? t.stuck : t.menu; $('mS').textContent = (won ? fmt(t.winS, { t: clockStr(tBase), n: G.moves }) + ' — ' : '') + fmt(t.stats, { w: S.wins, s: S.daily === dayKey(Date.now()) || S.daily === dayKey(Date.now() - 864e5) ? S.streak : 0 });
  $('dailyB').textContent = S.daily === dayKey(Date.now()) ? t.dailyDone : t.daily; $('randB').textContent = t.rand; $('closeB').textContent = t.close; $('closeB').hidden = !!won; $('menu').hidden = false; }
$('newB').onclick = () => menu(false); $('closeB').onclick = () => { $('menu').hidden = true; };
const begin = async daily => { $('menu').hidden = true; if (S.plays > 0 && S.plays % 2 === 0) await ad('interstitial'); deal(daily ? hash('daily' + dayKey(Date.now())) : (Math.random() * 4294967296) >>> 0, daily); };
$('dailyB').onclick = () => begin(true); $('randB').onclick = () => begin(false);
function texts() { const t = T(); document.title = t.title; document.documentElement.lang = lang; $('ttl').textContent = t.title; $('lang').textContent = '🌐 ' + lang.toUpperCase(); $('langSel').value = lang; $('snd').textContent = S.muted ? '🔇' : '🔊'; $('newB').textContent = t.newG; $('undoB').textContent = t.undo; if (G) render(); }
$('langSel').onchange = e => { lang = e.target.value; S.lang = lang; save(); texts(); };
$('snd').onclick = () => { S.muted = !S.muted; save(); texts(); };
addEventListener('resize', () => G && render()); addEventListener('pagehide', () => G && !G.won && save());
texts();
if (S.game && S.game.G && !S.game.G.won) { G = S.game.G; tBase = S.game.t || 0; undo = S.game.undo || []; t0 = Date.now(); render(); startClock(); maybeAuto(); } else { S.plays = S.plays || 0; deal((Math.random() * 4294967296) >>> 0, false); }
window.SOL = { get G() { return G; }, S, deal, tapStock, tapCard, target, findHint, hash }; // debug hook for automated tests
</script>
