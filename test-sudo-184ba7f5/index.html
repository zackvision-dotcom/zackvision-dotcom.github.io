<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">

<title>Sudoku Zen</title>
<style>
:root{--bg:#f4f1ea;--grille:#fffdf8;--txt:#2f3a35;--doux:#7b857f;--ligne:#cfd6cf;--fort:#55645b;--acc:#6f9a83;--acc-cl:#dfeee5;--meme:#e9f1ec;--sel:#c9e2d4;--erreur:#c8553d;--saisi:#3f6f8f;--carte:#fffdf8;--ombre:0 8px 24px rgba(47,58,53,.08)}
body.sombre{--bg:#16201c;--grille:#1d2924;--txt:#e6efe9;--doux:#93a39a;--ligne:#33443c;--fort:#7d968a;--acc:#8fc1a5;--acc-cl:#24352d;--meme:#22322b;--sel:#2f4a3d;--erreur:#ff8a73;--saisi:#9cc8e6;--carte:#1d2924;--ombre:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;transition:background .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.haut{display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px}
.titre{font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.titre small{display:block;font-size:.72rem;font-weight:600;color:var(--doux);letter-spacing:.06em;text-transform:uppercase}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--fort)}
.ico svg{width:24px;height:24px}
.infos{display:flex;justify-content:space-between;color:var(--doux);font-size:.88rem;font-weight:600;margin:6px 2px 10px}
.grille{display:grid;grid-template-columns:repeat(9,1fr);background:var(--grille);border:2px solid var(--fort);border-radius:10px;overflow:hidden;box-shadow:var(--ombre);aspect-ratio:1;width:100%}
.case{position:relative;display:grid;place-items:center;border-right:1px solid var(--ligne);border-bottom:1px solid var(--ligne);font-size:min(7vw,30px);font-weight:500;color:var(--saisi);transition:background .12s}
.case.donne{color:var(--txt);font-weight:700}
.case:nth-child(9n){border-right:0}
.case:nth-child(9n+3),.case:nth-child(9n+6){border-right:2px solid var(--fort)}
.case:nth-child(n+19):nth-child(-n+27),.case:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--fort)}
.case:nth-child(n+73){border-bottom:0}
.case.zone{background:var(--meme)}
.case.pareil{background:var(--acc-cl)}
.case.sel{background:var(--sel)}
.case.faux{color:var(--erreur)}
.case.indice{animation:pulse .6s}
@keyframes pulse{50%{transform:scale(1.15)}}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:min(2.6vw,11px);color:var(--doux);font-weight:600}
.notes span{display:grid;place-items:center}
.outils{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px}
.outil{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--fort);font-size:.74rem;font-weight:600;position:relative}
.outil svg{width:26px;height:26px}
.outil.on{color:var(--acc);background:var(--acc-cl)}
.outil .pastille{position:absolute;top:0;right:18%;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:#fff;font-size:.68rem;display:grid;place-items:center}
.pave{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.pave button{aspect-ratio:.8;border-radius:12px;background:var(--carte);box-shadow:var(--ombre);font-size:min(7.2vw,28px);font-weight:600;color:var(--saisi);position:relative}
.pave button small{position:absolute;bottom:3px;left:0;right:0;font-size:.58rem;color:var(--doux);font-weight:600}
.pave button.fini{opacity:.25}
.ecran{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:10px 6px}
.logo{width:92px;height:92px;margin:0 auto;border-radius:24px;background:var(--grille);box-shadow:var(--ombre);display:grid;grid-template-columns:repeat(3,1fr);padding:10px;gap:3px}
.logo i{border-radius:5px;background:var(--acc-cl);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--acc);font-size:.9rem}
h1{font-size:1.9rem;font-weight:700;letter-spacing:.01em}
.sous{color:var(--doux)}
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:1.02rem;background:var(--carte);box-shadow:var(--ombre);color:var(--txt)}
.btn.princ{background:var(--acc);color:#fff}
.btn small{display:block;font-weight:600;font-size:.76rem;opacity:.75;margin-top:2px}
.niveaux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.defi{background:linear-gradient(135deg,var(--acc),#4f7d66);color:#fff;border-radius:18px;padding:16px;text-align:left;box-shadow:var(--ombre)}
.defi b{font-size:1.05rem}
.defi p{opacity:.9;font-size:.86rem;margin-top:2px}
.voile{position:fixed;inset:0;background:rgba(20,28,24,.45);display:grid;place-items:center;z-index:20;padding:20px}
.boite{width:100%;max-width:380px;background:var(--carte);border-radius:22px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.boite h2{font-size:1.35rem;margin-bottom:6px}
.boite .pile{display:grid;gap:10px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px;font-size:.72rem;color:var(--doux);font-weight:600}
.stats b{display:block;font-size:1.1rem;color:var(--txt)}
.reglage{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--ligne);text-align:left;font-weight:600}
.interr{width:48px;height:28px;border-radius:14px;background:var(--ligne);position:relative;transition:background .2s}
.interr::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.interr.on{background:var(--acc)}.interr.on::after{left:23px}
.pub{position:fixed;inset:0;z-index:40;background:#111;color:#fff;display:grid;place-items:center;text-align:center}
.pub b{display:block;font-size:2.4rem;margin-top:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:50;max-width:90%}
</style>
</head>

  if (S.noads || S.parties < 3 || Date.now() - S.derPub < 240000) return Promise.resolve();
  S.derPub = Date.now(); sauver();
  return H("ads") ? natif("ads", { op: "interstitial" }) : pubTest();
}
function acheter() {
  if (!H("store")) { S.noads = true; sauver(); toast(T.achatOk + " (test)"); return reglages(); }
  natif("store", { op: "buy", id: PID }).then(function (r) { if (r) { S.noads = true; sauver(); toast(T.achatOk); reglages(); } });
}
function restaurer() { natif("store", { op: "restore" }).then(function (l) { if (Array.isArray(l) && l.indexOf(PID) >= 0) { S.noads = true; sauver(); } toast(T.restOk); reglages(); }); }
window.nativeStoreUpdate = function (pid) { if (pid === PID) { S.noads = true; sauver(); } };
if (H("ads")) natif("ads", { op: "init" });
if (H("store")) natif("store", { op: "owned" }).then(function (l) { if (Array.isArray(l) && l.indexOf(PID) >= 0) { S.noads = true; sauver(); } });

// ---------- Rappel quotidien « grille du jour » (notification locale, avec l'accord du joueur) ----------
// Appel natif : kit.postMessage({op:"remind", heure:"HH:MM", titre, texte}) pour programmer, {op:"remindOff"} pour annuler.
// À brancher par le Développeur dans les coques (UNUserNotificationCenter sur iOS, AlarmManager/WorkManager sur Android).
function heureRappel() { var d = new Date(); var h = Math.min(21, Math.max(8, d.getHours())); return String(h).padStart(2, "0") + ":" + String(d.getMinutes() < 30 ? 0 : 30).padStart(2, "0"); }
function activerRappel(on) {
  S.rappel = on ? heureRappel() : null; S.rappelDemande = true; sauver();
  if (H("kit")) natif("kit", on ? { op: "remind", heure: S.rappel, titre: T.notifTitre, texte: T.notifCorps } : { op: "remindOff" });
  if (on) toast(T.rappelOk + S.rappel);
}
function demanderRappel() { boite(T.rappelQ, [[T.rappelOui, function () { activerRappel(true); }], [T.non, function () { S.rappelDemande = true; sauver(); }]]); }

// ---------- Fenêtres ----------
function boite(html, boutons, gros) {
  var v = document.createElement("div"); v.className = "voile";
  v.innerHTML = '<div class="boite">' + (gros ? html : "<p style=\"font-weight:600\">" + html + "</p>") + '<div class="pile">' + boutons.map(function (b, k) { return '<button class="btn' + (k === 0 ? " princ" : "") + '" data-k="' + k + '">' + b[0] + "</button>"; }).join("") + "</div></div>";
  document.body.appendChild(v);
  v.querySelectorAll("[data-k]").forEach(function (el) { el.onclick = function () { v.remove(); var f = boutons[+el.dataset.k][1]; if (f) f(); }; });
}
function reglages() {
  var v = document.querySelector(".voile"); if (v) v.remove();
  v = document.createElement("div"); v.className = "voile";
  var ligne = function (k, txt) { return '<div class="reglage"><span>' + txt + '</span><button class="interr' + (S.reg[k] ? " on" : "") + '" data-r="' + k + '"></button></div>'; };
  v.innerHTML = '<div class="boite" style="text-align:left"><h2>' + T.reglages + "</h2>" + ligne("sombre", T.sombre) + ligne("surligner", T.surligner) + ligne("verifier", T.verifier) + '<div class="reglage"><span>' + T.rappel + (S.rappel ? ' <small class="sous">(' + S.rappel + ")</small>" : "") + '</span><button class="interr' + (S.rappel ? " on" : "") + '" data-rappel></button></div>' +
    '<div style="margin-top:16px"><b>' + T.sansPub + '</b><p class="sous" style="font-size:.86rem">' + T.sansPubTxt + '</p></div><div class="pile">' + (S.noads ? '<p class="sous">✓ ' + T.sansPub + "</p>" : '<button class="btn princ" data-acheter>' + T.acheter + "</button>") +
    '<button class="btn" data-restaurer>' + T.restaurer + "</button>" + (H("ads") ? '<button class="btn" data-consent>' + T.consent + "</button>" : "") + '<button class="btn" data-fermer>' + T.fermer + "</button></div></div>";
  document.body.appendChild(v);
  v.querySelectorAll("[data-r]").forEach(function (b) { b.onclick = function () { var k = b.dataset.r; S.reg[k] = !S.reg[k]; sauver(); b.classList.toggle("on", S.reg[k]); document.body.classList.toggle("sombre", !!S.reg.sombre); if (P) dessiner(); }; });
  v.querySelector("[data-rappel]").onclick = function () { activerRappel(!S.rappel); v.remove(); reglages(); };
  var a = v.querySelector("[data-acheter]"); if (a) a.onclick = function () { v.remove(); acheter(); };
  v.querySelector("[data-restaurer]").onclick = function () { v.remove(); restaurer(); };
  var c = v.querySelector("[data-consent]"); if (c) c.onclick = function () { natif("ads", { op: "consentForm" }); };
  v.querySelector("[data-fermer]").onclick = function () { v.remove(); };
}
function toast(t) { var el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2200); }
function vibrer(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// clavier sur ordinateur
document.addEventListener("keydown", function (e) {
  if (!P || !APP.querySelector(".grille")) return;
  if (e.key >= "1" && e.key <= "9") saisir(+e.key);
  else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") saisir(0);
  else if (e.key === "n") { modeNotes = !modeNotes; dessiner(); }
  else if (/^Arrow/.test(e.key) && sel >= 0) { var d = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[e.key]; sel = (sel + d + 81) % 81; dessiner(); e.preventDefault(); }
});
document.addEventListener("visibilitychange", function () { if (document.hidden) sauver(); });
window.SUDOKU = { generer: generer, resoudre: resoudre };
accueil();
})();
