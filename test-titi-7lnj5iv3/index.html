<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zouzou le Ouistiti</title><meta name="robots" content="noindex,nofollow">
<style>
  :root{--ink:#422006;--paper:#fffbeb;--edge:#d6b98c;--red:#dc2626;--green:#16a34a}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe6d8;font-family:ui-rounded,"Nunito","Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,236,190,.10) 0%,rgba(255,236,190,0) 45%,rgba(70,40,20,.30) 100%)}
  .pill{background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--edge)}
  #top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
  #needs{display:grid;grid-template-columns:auto 86px;gap:4px 6px;align-items:center}
  .bar{height:10px;border-radius:5px;background:#eadcc0;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:#4ade80;transition:width .3s}
  #right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #right button{pointer-events:auto;border:0;cursor:pointer;font-family:inherit}
  #toast{position:fixed;left:50%;top:27%;transform:translateX(-50%);max-width:84%;text-align:center;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;font-size:15px;line-height:1.35}
  .btn{border:0;border-radius:999px;font-weight:900;font-family:inherit;color:#fff;touch-action:none;cursor:pointer}
  #btns{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  #act{background:var(--green);font-size:16px;padding:16px 22px;box-shadow:0 5px 0 #14532d}
  #nice{background:#f59e0b;font-size:16px;padding:14px 18px;box-shadow:0 5px 0 #92400e}
  #naughty{background:#7b3fb8;font-size:16px;padding:14px 18px;box-shadow:0 5px 0 #4c2475}
  #who{align-self:flex-end}
  #menu{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(210px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:74vw}
  #menu button{background:var(--paper);color:var(--ink);border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;font-family:inherit;box-shadow:0 3px 0 var(--edge);text-align:left}
  #stick{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6);display:none;pointer-events:none}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85)}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(66,32,6,.35);padding:18px}
  .card{background:var(--paper);color:var(--ink);border-radius:22px;padding:20px 20px 16px;box-shadow:0 6px 0 var(--edge);text-align:center;max-width:400px;width:100%;max-height:86vh;overflow:auto}
  .card h1{font-size:38px;margin:0;color:#b45309;text-shadow:0 3px 0 #fde68a}.card h2{margin:0 0 8px;font-size:21px}
  .card p{margin:8px 0 14px;font-weight:600;line-height:1.4}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .big{background:var(--red);font-size:22px;padding:14px 38px;box-shadow:0 5px 0 #7f1d1d}
  .small{background:#a16207;font-size:14px;padding:8px 16px;box-shadow:0 3px 0 #713f12}
  .who{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 10px;margin:6px 0;font-weight:700;text-align:left;box-shadow:0 2px 0 var(--edge)}
  .who small{display:block;font-weight:600;opacity:.7}
  #ideas{text-align:left;font-weight:600;line-height:1.5;margin:10px 0}
  #zzz{position:fixed;inset:0;background:rgba(20,24,60,.55);color:#fff;font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center;pointer-events:none}
  [hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="vig"></div>
<div id="top"><div id="needs" class="pill"></div><div id="right"><div id="clock" class="pill"></div><button id="albumBtn" class="pill">Album</button><button id="menuBtn" class="pill">⏸</button></div></div>
<div id="goal" class="pill" style="position:fixed;left:50%;transform:translateX(-50%);top:calc(104px + env(safe-area-inset-top,0px));font-size:13px;max-width:80%;text-align:center;pointer-events:none"></div><div id="toast"></div><div id="zzz" hidden>Zzz…</div>
<div id="stick"><div id="knob"></div></div>
<div id="menu" hidden></div>
<div id="btns"><div id="who" class="pill" hidden></div><button id="nice" class="btn" hidden></button><button id="naughty" class="btn" hidden></button><button id="act" class="btn" hidden></button></div>
<div id="title" class="overlay"><div class="card">
  <div style="font-size:60px;line-height:1">🐒</div><h1 id="ttl"></h1><p id="sub"></p>
  <div class="row"><button id="playBtn" class="btn big"></button></div>
  <div class="row" style="margin-top:14px"><button id="langBtn" class="btn small"></button><button id="sndBtn" class="btn small"></button></div>
</div></div>
<div id="albumUI" class="overlay" hidden><div class="card"><h2 id="albT"></h2><div id="albBody"></div><div class="row"><button id="freeBtn" class="btn small" hidden></button><button id="albClose" class="btn small">OK</button></div></div></div>
<div id="adoptUI" class="overlay" hidden><div class="card"><div style="font-size:50px">🏠</div><p id="adoptT"></p><div class="row"><button id="adoptYes" class="btn big" style="font-size:18px;padding:12px 26px"></button><button id="adoptNo" class="btn small"></button></div></div></div>
