<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f3d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Compteur de points — Belote, Tarot, Yams, Rami</title>
<style>
:root{--vert:#0f3d2e;--vert2:#15523e;--tapis:#1b6b50;--or:#e8b64a;--creme:#fbf7ee;--carte:#ffffff;--txt:#1d2a24;--doux:#6b7a72;--ligne:#e6e0d2;--rouge:#c0392b;--bleu:#2f6fb0;--ombre:0 6px 20px rgba(15,61,46,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--creme);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.entete{background:linear-gradient(160deg,var(--vert),var(--tapis));color:#fff;padding:max(14px,env(safe-area-inset-top)) 16px 18px;border-radius:0 0 24px 24px}
.entete .l1{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.entete h1{font-size:1.25rem;font-weight:800}
.entete p{opacity:.85;font-size:.88rem;margin-top:2px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.ico svg{width:22px;height:22px}
.corps{flex:1;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
.jeux{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jeu{background:var(--carte);border-radius:20px;padding:16px 14px;text-align:left;box-shadow:var(--ombre);border:1px solid var(--ligne)}
.jeu .em{font-size:1.9rem}
.jeu b{display:block;font-size:1.05rem;margin-top:6px}
.jeu small{color:var(--doux);font-size:.8rem}
h2{font-size:1.05rem;margin:22px 2px 10px}
.carte{background:var(--carte);border-radius:18px;padding:14px;box-shadow:var(--ombre);border:1px solid var(--ligne)}
.liste>*+*{margin-top:10px}
.ligne-partie{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%}
.ligne-partie small{color:var(--doux);display:block;font-size:.78rem}
.tag{font-size:.72rem;font-weight:700;padding:4px 8px;border-radius:8px;background:#eef5f1;color:var(--vert2);white-space:nowrap}
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:1rem;text-align:center;background:var(--carte);border:1px solid var(--ligne);box-shadow:var(--ombre)}
.btn.vert{background:var(--vert2);color:#fff;border:0}
.btn.or{background:var(--or);color:#2b1d00;border:0}
.btn.petit{padding:10px;font-size:.9rem;box-shadow:none}
.pile{display:grid;gap:10px}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:700;font-size:.86rem;margin:14px 0 6px}
input[type=text],input[type=number],select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--ligne);background:#fff;font-size:16px}
input:focus,select:focus{outline:2px solid var(--tapis);border-color:transparent}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix button{padding:10px 14px;border-radius:12px;border:1.5px solid var(--ligne);background:#fff;font-weight:700;font-size:.92rem}
.choix button.on{border-color:var(--tapis);background:#e6f2ec;color:var(--vert)}
.joueurs-sel{display:flex;flex-wrap:wrap;gap:8px}
.joueurs-sel button{padding:9px 12px;border-radius:999px;border:1.5px solid var(--ligne);background:#fff;font-weight:700;font-size:.9rem}
.joueurs-sel button.on{background:var(--vert2);color:#fff;border-color:var(--vert2)}
.scores{display:grid;gap:10px}
.score{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;background:var(--carte);box-shadow:var(--ombre);border:1px solid var(--ligne)}
.score b{font-size:1.05rem}
.score .pts{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums}
.score.tete{border-color:var(--or);background:linear-gradient(90deg,#fff8e6,#fff)}
.score .pts.neg{color:var(--rouge)}
.manches{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.manches th,.manches td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--ligne)}
.manches th:first-child,.manches td:first-child{text-align:left;color:var(--doux)}
.manches th{font-size:.78rem;color:var(--doux)}
.tableau-wrap{overflow-x:auto}
.yams{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.yams th,.yams td{border:1px solid var(--ligne);padding:0;text-align:center;font-size:.9rem}
.yams th{background:#f4efe3;padding:8px 4px;font-size:.78rem}
.yams td:first-child{text-align:left;padding:8px;font-weight:600;background:#faf7f0;white-space:nowrap}
.yams td button{width:100%;min-width:52px;min-height:40px;font-weight:700}
.yams td button.vide{color:#c6c0b3}
.yams tr.total td{font-weight:800;background:#eef5f1}
.yams tr.bonus td{color:var(--doux);font-size:.8rem}
.voile{position:fixed;inset:0;background:rgba(10,30,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.feuille{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--creme);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.feuille h3{font-size:1.15rem;margin-bottom:4px}
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pave button{padding:14px;border-radius:12px;background:#fff;border:1px solid var(--ligne);font-weight:800;font-size:1.1rem}
.aide{font-size:.82rem;color:var(--doux);margin-top:6px}
.apercu{min-height:52px;margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--ligne);font-size:.92rem;display:flex;align-items:center}
.choix.capot button{border-style:dashed}
.actions-fixes{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));margin:16px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--creme);border-top:1px solid var(--ligne)}
.regle{font-size:.88rem;line-height:1.55}
.regle li{margin:4px 0 4px 18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--vert);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:90%;text-align:center}
.pub{position:fixed;inset:0;z-index:50;background:#111;color:#fff;display:grid;place-items:center;text-align:center}
.pub b{display:block;font-size:2.4rem;margin-top:8px}
.vide{color:var(--doux);text-align:center;padding:16px;font-size:.9rem}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function () {
"use strict";
// ---------- Pont natif games-kit (identique iOS / Android) ----------
var H = function (n) { return window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers[n]; };
var natif = function (n, m) { var h = H(n); return h ? Promise.resolve(h.postMessage(m)).catch(function () { return false; }) : Promise.resolve(null); };
var PID = "com.zvisionclub.compteurpoints.noads";
var BOUTIQUE = !!H("store") || /[?&]test=1/.test(location.search);

// ---------- Sauvegarde ----------
var CLE = "compteur_v1";
var S = (function () { try { return JSON.parse(localStorage.getItem(CLE)) || {}; } catch (e) { return {}; } })();
S.joueurs = S.joueurs || []; S.parties = S.parties || []; S.noads = !!S.noads; S.finies = S.finies || 0; S.derPub = S.derPub || 0;
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) {} }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
var APP = document.getElementById("app");

// ---------- Règles de calcul ----------
var JEUX = {
  belote: { nom: "Belote", em: "🂡", sous: "2 équipes · 162 pts par donne", min: 2, max: 2, equipes: true },
  tarot: { nom: "Tarot", em: "🃏", sous: "3 à 5 joueurs · barème FFT", min: 3, max: 5 },
  yams: { nom: "Yams", em: "🎲", sous: "Feuille de marque complète", min: 1, max: 8 },
  rami: { nom: "Rami", em: "🂮", sous: "Pénalités · limite au choix", min: 2, max: 8 }
};
// Belote : la donne vaut 162 (dix de der compris), capot 252, Belote-Rebelote 20 pour l'équipe qui l'annonce.
function calculBelote(m) {
  var a = m.ptsPreneur, preneur = m.preneur, def = 1 - preneur, s = [0, 0];
  if (m.capot) { s[m.capot - 1] = 252; }
  else {
    var pp = Math.max(0, Math.min(162, a)), pd = 162 - pp;
    var bel = m.belote != null ? m.belote : -1;
    var totPren = pp + (bel === preneur ? 20 : 0), totDef = pd + (bel === def ? 20 : 0);
    if (totPren > totDef) { s[preneur] = pp; s[def] = pd; }
    else if (totPren === totDef) { if (S.egalite === "partage") { s[preneur] = pp; s[def] = pd; } else { s[preneur] = 0; s[def] = pd; } } // litige : les points du preneur restent en suspens ; partage : chacun ses points
    else { s[preneur] = 0; s[def] = 162; } // dedans : la défense marque tout
  }
  if (m.belote != null && m.belote >= 0) s[m.belote] += 20;
  return s;
}
function etatBelote(m) {
  if (m.capot) return "capot";
  var pp = Math.max(0, Math.min(162, m.ptsPreneur)), pd = 162 - pp, bel = m.belote != null ? m.belote : -1;
  var a = pp + (bel === m.preneur ? 20 : 0), d = pd + (bel === 1 - m.preneur ? 20 : 0);
  return a > d ? "fait" : (a === d ? (S.egalite === "partage" ? "partage" : "litige") : "dedans");
}
// Tarot (barème FFT) : points à faire selon les bouts, (25 + écart + petit au bout) × contrat, poignée et chelem en plus.
var BESOIN = [56, 51, 41, 36], MULT = { petite: 1, garde: 2, sans: 4, contre: 6 }, POIGNEE = { 0: 0, 1: 20, 2: 30, 3: 40 };
function calculTarot(m, n) {
  var besoin = BESOIN[m.bouts], ecart = m.points - besoin, gagne = ecart >= 0;
  ecart = (S.arrondi === "inf" ? Math.floor(Math.abs(ecart)) : Math.ceil(Math.abs(ecart))) * (gagne ? 1 : -1); // demi-point arrondi (supérieur par défaut, inférieur en option) : scores entiers
  var mult = MULT[m.contrat], signe = gagne ? 1 : -1;
  var petit = m.petit === "att" ? 10 : (m.petit === "def" ? -10 : 0);
  var chelem = { annonce: 400, nonannonce: 200, rate: -200 }[m.chelem] || 0;
  // valeur pour UN défenseur, vue du preneur : (25 + écart) × contrat, petit au bout × contrat, poignée au camp gagnant, chelem
  var v = signe * (25 + Math.abs(ecart)) * mult + petit * mult + signe * POIGNEE[m.poignee || 0] + chelem;
  var s = new Array(n).fill(0), pren = m.preneur, part = m.partenaire;
  if (n === 5 && part != null && part !== pren) {
    for (var i = 0; i < n; i++) s[i] = -v;
    s[pren] = 2 * v; s[part] = v;
  } else {
    for (var j = 0; j < n; j++) s[j] = -v;
    s[pren] = (n - 1) * v;
  }
  return s;
}
// Yams : section haute (bonus 35 si 63 ou plus), section basse.
var YAMS = [
  { k: "1", n: "As (1)", haut: true, max: 5, pas: 1 }, { k: "2", n: "Deux", haut: true, max: 10, pas: 2 }, { k: "3", n: "Trois", haut: true, max: 15, pas: 3 },
  { k: "4", n: "Quatre", haut: true, max: 20, pas: 4 }, { k: "5", n: "Cinq", haut: true, max: 25, pas: 5 }, { k: "6", n: "Six", haut: true, max: 30, pas: 6 },
  { k: "brelan", n: "Brelan", somme: true }, { k: "carre", n: "Carré", somme: true }, { k: "full", n: "Full", fixe: 25 },
  { k: "petite", n: "Petite suite", fixe: 30 }, { k: "grande", n: "Grande suite", fixe: 40 }, { k: "yams", n: "Yams", fixe: 50 }, { k: "chance", n: "Chance", somme: true }
];
function totauxYams(f) {
  var haut = 0, bas = 0;
  YAMS.forEach(function (c) { var v = f[c.k]; if (typeof v === "number") { if (c.haut) haut += v; else bas += v; } });
  var bonus = haut >= 63 ? 35 : 0;
  return { haut: haut, bonus: bonus, bas: bas, total: haut + bonus + bas };
}

// ---------- Totaux d'une partie ----------
function totaux(p) {
  if (p.jeu === "yams") return p.feuilles.map(function (f) { return totauxYams(f).total; });
  var t = new Array(p.noms.length).fill(0);
  p.manches.forEach(function (m) { m.s.forEach(function (v, i) { t[i] += v; }); });
  return t;
}
function gagnant(p) {
  var t = totaux(p);
  if (p.jeu === "rami") { var min = Math.min.apply(null, t); return t.indexOf(min); }
  var max = Math.max.apply(null, t); return t.indexOf(max);
}
function partieFinie(p) {
  var t = totaux(p);
  if (p.jeu === "belote") return t.some(function (v) { return v >= p.cible; });
  if (p.jeu === "rami") return t.some(function (v) { return v >= p.cible; });
  if (p.jeu === "yams") return p.feuilles.every(function (f) { return YAMS.every(function (c) { return typeof f[c.k] === "number"; }); });
  return false;
}

// ---------- Accueil ----------
function accueil() {
  var enCours = S.parties.filter(function (p) { return !p.fin; });
  var h = '<div class="entete"><div class="l1"><div><h1>Compteur de points</h1><p>Belote · Tarot · Yams · Rami</p></div><button class="ico" data-reg aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button></div></div>';
  h += '<div class="corps"><div class="jeux">' + Object.keys(JEUX).map(function (k) { var j = JEUX[k]; return '<button class="jeu" data-jeu="' + k + '"><span class="em">' + j.em + "</span><b>" + j.nom + "</b><small>" + j.sous + "</small></button>"; }).join("") + "</div>";
  if (enCours.length) h += "<h2>Parties en cours</h2><div class=\"liste\">" + enCours.map(lignePartie).join("") + "</div>";
  var finies = S.parties.filter(function (p) { return p.fin; }).slice(-20).reverse();
  h += "<h2>Historique</h2>" + (finies.length ? '<div class="liste">' + finies.map(lignePartie).join("") + "</div>" : '<div class="carte vide">Tes parties terminées apparaîtront ici.</div>');
  h += '<h2>Joueurs</h2><div class="carte">' + (S.joueurs.length ? '<div class="joueurs-sel">' + S.joueurs.map(function (j) { return "<button>" + esc(j) + "</button>"; }).join("") + "</div>" : '<p class="vide" style="padding:4px">Les joueurs que tu ajoutes sont retenus pour les prochaines parties.</p>') + "</div>";
  h += '<h2>Règles de calcul</h2><div class="deux">' + Object.keys(JEUX).map(function (k) { return '<button class="btn petit" data-regle="' + k + '">' + JEUX[k].em + " " + JEUX[k].nom + "</button>"; }).join("") + "</div></div>";
  APP.innerHTML = h;
  APP.querySelectorAll("[data-jeu]").forEach(function (b) { b.onclick = function () { configurer(b.dataset.jeu); }; });
  APP.querySelectorAll("[data-partie]").forEach(function (b) { b.onclick = function () { ouvrir(b.dataset.partie); }; });
  APP.querySelectorAll("[data-regle]").forEach(function (b) { b.onclick = function () { regles(b.dataset.regle); }; });
  APP.querySelector("[data-reg]").onclick = reglages;
}
function lignePartie(p) {
  var t = totaux(p), g = gagnant(p), d = new Date(p.date);
  return '<button class="carte ligne-partie" data-partie="' + p.id + '"><span><b>' + JEUX[p.jeu].em + " " + JEUX[p.jeu].nom + "</b><small>" + p.noms.map(function (n, i) { return esc(n) + " " + t[i]; }).join(" · ") + "</small><small>" + d.toLocaleDateString("fr-FR") + "</small></span>" +
    '<span class="tag">' + (p.fin ? "🏆 " + esc(p.noms[g]) : "En cours") + "</span></button>";
}

// ---------- Nouvelle partie ----------
function configurer(jeu) {
  var J = JEUX[jeu], choisis = [], equipes = ["Nous", "Eux"], cible = jeu === "belote" ? 1000 : (jeu === "rami" ? 100 : 0);
  function dessiner() {
    var h = '<div class="entete"><div class="l1"><button class="ico" data-retour>‹</button><div style="flex:1"><h1>' + J.em + " " + J.nom + "</h1><p>Nouvelle partie</p></div></div></div><div class=\"corps\">";
    if (J.equipes) {
      h += '<label>Équipe 1</label><input type="text" data-eq="0" value="' + esc(equipes[0]) + '" maxlength="20"><label>Équipe 2</label><input type="text" data-eq="1" value="' + esc(equipes[1]) + '" maxlength="20">';
      h += '<label>Partie en</label><div class="choix">' + [501, 1000, 1500, 2000].map(function (v) { return '<button data-cible="' + v + '"' + (v === cible ? ' class="on"' : "") + ">" + v + " pts</button>"; }).join("") + "</div>";
    } else {
      h += "<label>Joueurs (" + J.min + " à " + J.max + ")</label>";
      h += '<div class="joueurs-sel">' + S.joueurs.map(function (j) { return '<button data-j="' + esc(j) + '"' + (choisis.indexOf(j) >= 0 ? ' class="on"' : "") + ">" + (choisis.indexOf(j) >= 0 ? choisis.indexOf(j) + 1 + ". " : "") + esc(j) + "</button>"; }).join("") + "</div>";
      h += '<div class="deux" style="margin-top:10px;grid-template-columns:1fr auto"><input type="text" data-nouveau placeholder="Ajouter un joueur" maxlength="16"><button class="btn petit vert" data-ajouter style="width:auto;padding:0 18px">+</button></div>';
      if (jeu === "rami") h += '<label>Perdant quand il atteint</label><div class="choix">' + [100, 200, 300, 500].map(function (v) { return '<button data-cible="' + v + '"' + (v === cible ? ' class="on"' : "") + ">" + v + " pts</button>"; }).join("") + "</div>";
    }
    var ok = J.equipes || (choisis.length >= J.min && choisis.length <= J.max);
    h += '<div style="margin-top:22px"><button class="btn vert" data-go' + (ok ? "" : " disabled style=\"opacity:.45\"") + ">Commencer</button></div></div>";
    APP.innerHTML = h;
    APP.querySelector("[data-retour]").onclick = accueil;
    APP.querySelectorAll("[data-eq]").forEach(function (i) { i.oninput = function () { equipes[+i.dataset.eq] = i.value; }; });
    APP.querySelectorAll("[data-cible]").forEach(function (b) { b.onclick = function () { cible = +b.dataset.cible; dessiner(); }; });
    APP.querySelectorAll("[data-j]").forEach(function (b) { b.onclick = function () { var n = b.dataset.j, k = choisis.indexOf(n); if (k >= 0) choisis.splice(k, 1); else if (choisis.length < J.max) choisis.push(n); dessiner(); }; });
    var add = APP.querySelector("[data-ajouter]");
    if (add) {
      var champ = APP.querySelector("[data-nouveau]");
      var ajouter = function () { var n = champ.value.trim(); if (!n) return; if (S.joueurs.indexOf(n) < 0) { S.joueurs.push(n); sauver(); } if (choisis.indexOf(n) < 0 && choisis.length < J.max) choisis.push(n); dessiner(); };
      add.onclick = ajouter; champ.onkeydown = function (e) { if (e.key === "Enter") ajouter(); };
    }
    APP.querySelector("[data-go]").onclick = function () {
      if (!ok) return;
      var noms = J.equipes ? equipes.map(function (e, i) { return e.trim() || "Équipe " + (i + 1); }) : choisis.slice();
      var p = { id: uid(), jeu: jeu, noms: noms, date: Date.now(), manches: [], cible: cible, fin: false };
      if (jeu === "yams") p.feuilles = noms.map(function () { return {}; });
      S.parties.push(p); sauver(); ouvrir(p.id);
    };
  }
  dessiner();
}

// ---------- Partie ----------
function ouvrir(id) {
  var p = S.parties.filter(function (x) { return x.id === id; })[0]; if (!p) return accueil();
  if (p.jeu === "yams") return feuilleYams(p);
  var t = totaux(p), g = gagnant(p);
  var h = '<div class="entete"><div class="l1"><button class="ico" data-retour>‹</button><div style="flex:1"><h1>' + JEUX[p.jeu].em + " " + JEUX[p.jeu].nom + "</h1><p>" + (p.cible ? "Partie en " + p.cible + " pts · " : "") + p.manches.length + " manche(s)</p></div></div></div><div class=\"corps\">";
  h += '<div class="scores">' + p.noms.map(function (n, i) { return '<div class="score' + (p.manches.length && i === g ? " tete" : "") + '"><b>' + (p.manches.length && i === g ? "👑 " : "") + esc(n) + '</b><span class="pts' + (t[i] < 0 ? " neg" : "") + '">' + t[i] + "</span></div>"; }).join("") + "</div>";

    '<div class="pile" style="margin-top:12px">' + (BOUTIQUE ? '<button class="btn" data-restaurer>Restaurer mes achats</button>' : "") + (H("ads") ? '<button class="btn" data-consent>Choix publicitaires</button>' : "") +
    '<button class="btn" data-joueurs>Effacer la liste des joueurs</button><button class="btn" data-fermer>Fermer</button></div><p class="aide" style="text-align:center;margin-top:10px">Tes parties restent sur ton téléphone.</p>', function (v) {
    var a = v.querySelector("[data-acheter]"); if (a) a.onclick = function () {
      if (!H("store")) { S.noads = true; sauver(); toast("Merci ! (achat test)"); v.remove(); return; }
      natif("store", { op: "buy", id: PID }).then(function (r) { if (r) { S.noads = true; sauver(); toast("Merci ! Plus de pub."); } v.remove(); });
    };
    var rs = v.querySelector("[data-restaurer]"); if (rs) rs.onclick = function () { natif("store", { op: "restore" }).then(function (l) { if (Array.isArray(l) && l.indexOf(PID) >= 0) { S.noads = true; sauver(); } toast("Achats restaurés"); v.remove(); }); };
    var c = v.querySelector("[data-consent]"); if (c) c.onclick = function () { natif("ads", { op: "consentForm" }); };
    v.querySelector("[data-joueurs]").onclick = function () { if (confirm("Effacer tous les joueurs enregistrés ?")) { S.joueurs = []; sauver(); v.remove(); accueil(); } };
    v.querySelector("[data-fermer]").onclick = function () { v.remove(); };
  });
}
window.nativeStoreUpdate = function (pid) { if (pid === PID) { S.noads = true; sauver(); } };
if (H("ads")) natif("ads", { op: "init" });
if (H("store")) natif("store", { op: "owned" }).then(function (l) { if (Array.isArray(l) && l.indexOf(PID) >= 0) { S.noads = true; sauver(); } });
function toast(t) { var el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2400); }

window.COMPTEUR = { calculBelote: calculBelote, calculTarot: calculTarot, totauxYams: totauxYams };
accueil();
